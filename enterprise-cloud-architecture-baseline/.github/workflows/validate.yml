name: Validate architecture repository
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f requirements/business-requirements.md
          test -f architecture/aws/reference-architecture.mmd
          test -f architecture/azure/reference-architecture.mmd
          test -f security/threat-model.md
      - name: Check for empty files
        run: |
          find . -type f -not -path './.git/*' -size 0 -print -quit | grep -q . && exit 1 || true
      - name: Check architecture source markers
        run: |
          grep -q 'flowchart' architecture/aws/reference-architecture.mmd
          grep -q 'flowchart' architecture/azure/reference-architecture.mmd
